name: NBCU Calendar Sync

on:
  schedule:
    - cron: '0 1 * * 2'   # Every Tuesday 01:00 UTC
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r nbcu_sync/requirements.txt

      - name: Write OAuth credentials
        run: |
          echo '${{ secrets.GOOGLE_OAUTH_CREDENTIALS }}' > /tmp/credentials.json
          echo '${{ secrets.GOOGLE_OAUTH_TOKEN }}' > /tmp/token.json

      - name: Run sync
        env:
          GOOGLE_OAUTH_CREDENTIALS: /tmp/credentials.json
          GOOGLE_OAUTH_TOKEN: /tmp/token.json
        run: python nbcu_sync/nbcu_sync.py
